<main class="app-shell">
  <header class="topbar">
    <h1>Angular DOM Benchmark</h1>
    <div class="actions">
      <button (click)="renderN(100)">Render 100</button>
      <button (click)="renderN(500)">Render 500</button>
      <button (click)="renderN(1000)">Render 1000</button>
      <button (click)="updateFifty()">Update 50</button>
      <button (click)="deleteFifty()">Delete 50</button>
    </div>
  </header>

  <div class="form-row">
    <input [(ngModel)]="newTask" placeholder="Add a task" />
    <select [(ngModel)]="priority">
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
    <button (click)="addTask()">Add task</button>
  </div>

  <ul class="task-list">
    <li *ngFor="let task of tasks" class="task-item">
      <input [(ngModel)]="task.title" />
      <select [(ngModel)]="task.priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
      <button (click)="deleteTask(task.id)">Delete</button>
    </li>
  </ul>
</main>
